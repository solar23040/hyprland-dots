general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/solar/Pictures/Wallpapers/wallhaven-yqkl97_3840x2160.png
    blur_passes = 2
    blur_size = 7
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(205, 214, 244)
    font_size = 96
    font_family = Sans
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 15
    font_family = Sans
    placeholder_text = Input password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}
